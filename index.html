<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive internship listing board">
  <title>Internship Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <p class="eyebrow">STUDENT OPPORTUNITIES</p>
        <h1>Internship Board</h1>
        <p class="subtitle">
          Find beginner-friendly internships and build real-world skills.
        </p>
      </div>
    </div>
  </header>
  <main class="container">
    <section class="controls" aria-labelledby="search-heading">
      <h2 id="search-heading">Find an internship</h2>
      <div class="control-grid">
        <div class="field">
          <label for="search">Search internships</label>
          <input
            id="search"
            type="search"
            placeholder="Try JavaScript, UI/UX, SQL..."
            autocomplete="off"
          >
        </div>
        <div class="field">
          <label for="domain">Filter by domain</label>
          <select id="domain">
            <option value="all">All domains</option>
            <option value="Full Stack Development">Full Stack Development</option>
            <option value="UI/UX">UI/UX</option>
            <option value="Data Analytics">Data Analytics</option>
            <option value="Cyber Security">Cyber Security</option>
          </select>
        </div>
      </div>
    </section>
    <section aria-labelledby="results-heading">
      <div class="section-title">
        <h2 id="results-heading">
          Available internships
        </h2>
        <span
          id="resultCount"
          aria-live="polite"
        ></span>
      </div>
      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      ></div>
      <div
        id="internshipList"
        class="internship-grid"
      ></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>
        Built with semantic HTML, responsive CSS and vanilla JavaScript.
      </p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
